name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, build, package, official DSH mount
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        env:
          # pnpm 11 supply-chain policy rejects packages newer than 24h;
          # freshly published official rc releases must install immediately.
          npm_config_minimum_release_age: '0'
          npm_config_trust_lockfile: 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --trust-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build web and host bundles
        run: pnpm run build:js

      - name: Pack source-platform smoke artifact
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          tar -tzf dist/dsh-bgm-*.tgz | tee "$RUNNER_TEMP/package-files.txt"
          grep -F 'package/lib/index.js' "$RUNNER_TEMP/package-files.txt"
          grep -F 'package/lib/client.js' "$RUNNER_TEMP/package-files.txt"
          grep -F 'package/cordis.patch.yml' "$RUNNER_TEMP/package-files.txt"

      - name: Install pinned official DSH CLI
        run: npm install --global @deepseek-ai/dsh@0.1.0-rc.8

      - name: Mount through the official plugin command
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
          DSH_TELEMETRY_DISABLED: '1'
        run: |
          package_path="$(find "$PWD/dist" -name 'dsh-bgm-*.tgz' -print -quit)"
          dsh plugin --profile web add "$package_path"
          dsh web --dump-config > "$RUNNER_TEMP/dsh-web-config.yml"
          grep -F '# == dsh-bgm' "$RUNNER_TEMP/dsh-web-config.yml"
          grep -F 'name: dsh-bgm' "$RUNNER_TEMP/dsh-web-config.yml"

      - name: Reject personal paths in published text
        run: |
          if rg -n '/Users/[^/]+|[A-Za-z]:\\Users\\[^\\]+' README.md README.en.md README.zh.md package.json src scripts; then
            echo 'Personal path found in publishable text.' >&2
            exit 1
          fi

  native:
    name: Native helper (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal
            os: macos-15
            platform: macos
          - label: Windows x64
            os: windows-2022
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        if: matrix.platform == 'windows'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build universal macOS helper
        if: matrix.platform == 'macos'
        env:
          DSH_BGM_MACOS_UNIVERSAL: '1'
        run: node scripts/build-native.mjs

      - name: Verify universal macOS helper
        if: matrix.platform == 'macos'
        run: |
          test -x native/bin/dsh-bgm-helper-macos
          lipo native/bin/dsh-bgm-helper-macos -verify_arch arm64 x86_64
          codesign --verify --strict native/bin/dsh-bgm-helper-macos

      - name: Build Windows x64 helper
        if: matrix.platform == 'windows'
        run: node scripts/build-native.mjs

      - name: Verify Windows helper
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $helper = Get-Item native/bin/dsh-bgm-helper-windows.exe
          if ($helper.Length -lt 100000) { throw 'Windows helper is unexpectedly small.' }
